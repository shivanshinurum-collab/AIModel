# ============================================================
# MEDIUM MODEL CONFIG — ~85M parameters
# Best for: multi-GPU training, larger datasets
# ============================================================

model:
  name: "medium"
  vocab_size: 32000
  max_seq_len: 1024
  d_model: 512
  n_layers: 12
  n_heads: 8
  d_ff: 2048
  dropout: 0.1
  bias: true

training:
  batch_size: 8
  gradient_accumulation_steps: 16
  max_steps: 100000
  eval_interval: 2000
  save_interval: 5000
  learning_rate: 1.5e-4
  min_lr: 1.5e-5
  warmup_steps: 2000
  weight_decay: 0.1
  grad_clip: 1.0
  mixed_precision: true
  compile_model: true

data:
  dataset_path: "datasets/processed/train.txt"
  val_path: "datasets/processed/val.txt"
  tokenizer_path: "tokenizer/saved/tokenizer.json"
  num_workers: 8

logging:
  log_dir: "logs"
  tensorboard: true
  log_interval: 50

checkpoint:
  checkpoint_dir: "checkpoints"
  keep_last_n: 5
