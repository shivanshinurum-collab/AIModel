# ============================================================
# LARGE MODEL CONFIG — ~350M parameters
# Best for: high-end GPU cluster training
# ============================================================

model:
  name: "large"
  vocab_size: 50000
  max_seq_len: 2048
  d_model: 1024
  n_layers: 24
  n_heads: 16
  d_ff: 4096
  dropout: 0.1
  bias: true

training:
  batch_size: 4
  gradient_accumulation_steps: 32
  max_steps: 300000
  eval_interval: 5000
  save_interval: 10000
  learning_rate: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 5000
  weight_decay: 0.1
  grad_clip: 1.0
  mixed_precision: true
  compile_model: true

data:
  dataset_path: "datasets/processed/train.txt"
  val_path: "datasets/processed/val.txt"
  tokenizer_path: "tokenizer/saved/tokenizer.json"
  num_workers: 16

logging:
  log_dir: "logs"
  tensorboard: true
  log_interval: 100

checkpoint:
  checkpoint_dir: "checkpoints"
  keep_last_n: 3
